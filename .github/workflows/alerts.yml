name: Price alerts

# Vercel Hobby cron runs once a day, so GitHub calls the checker every 15 minutes instead.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the alerts checker
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://website-analytics-meridian.vercel.app/api/alerts/check
